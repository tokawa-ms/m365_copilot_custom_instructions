<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Custom Instructions by tokawa-ms</title>
  <desc id="desc">An independent, unofficial collection for Microsoft 365 Copilot, published by tokawa-ms. 21 copy-ready modules in Japanese and English. Not affiliated with, authorized, sponsored, or endorsed by Microsoft.</desc>
  <defs>
